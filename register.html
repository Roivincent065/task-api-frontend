<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Task API</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="container">
        <h1>Register</h1>

        <form id="register-form">
            <input
                type="text"
                id="name"
                placeholder="Name"
                required
            />

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            />

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            />

            <button type="submit">
                Register
            </button>
        </form>

        <p>
            Already have an account?
            <a href="index.html">Login</a>
        </p>
    </div>

    <script type="module" src="register.js"></script>
</body>
</html>
